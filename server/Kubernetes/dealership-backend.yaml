apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-backend
  template:
    metadata:
      labels:
        app: dealership-backend
    spec:
      containers:
        - name: dealership-backend
          image: YOUR_IMAGE_REGISTRY/dealership-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3030
          env:
            - name: MONGODB_URI
              value: "mongodb://mongo:27017/"
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-backend
spec:
  selector:
    app: dealership-backend
  ports:
    - name: http
      port: 3030
      targetPort: 3030
      